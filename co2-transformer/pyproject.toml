[project]
name = "co2-transformer"
version = "0.1.0"
description = "From-scratch PyTorch Transformer forecasting CO2 in a carbon-capture absorber (AI-Challenge)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

# Linux (Docker) gets the CPU-only torch wheels: ~200 MB instead of ~2 GB of CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
