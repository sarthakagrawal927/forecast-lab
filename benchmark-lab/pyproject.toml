[project]
name = "benchmark-lab"
version = "0.1.0"
description = "Long-horizon forecasting benchmarks (ETT, Weather, Electricity): baselines vs linear vs Transformer vs hybrid."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "torch>=2.14.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
